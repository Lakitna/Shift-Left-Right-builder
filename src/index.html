<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Shift-Left-Right Builder</title>
        <meta
            name="description"
            content="Build, edit and share your own shift-left / shift-right quality model as a graph. The full model lives in the page URL."
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="app-header">
            <h1 class="app-title">Shift-Left-Right Builder</h1>
            <div class="controls">
                <div class="actions">
                    <a
                        class="github-link"
                        href="https://github.com/Lakitna/Shift-Left-Right-builder"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="View source on GitHub"
                        title="View source on GitHub"
                    >
                        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
                            <path
                                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.15.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                            />
                        </svg>
                    </a>
                    <div class="style-wrap">
                        <button id="btn-style" type="button" aria-haspopup="true" aria-expanded="false" title="Choose the visual style of the graph and the app">
                            Style: Classic ▾
                        </button>
                        <div id="style-menu" class="share-menu style-menu" hidden></div>
                    </div>
                    <button id="btn-theme" type="button" aria-label="Toggle dark mode">🌙</button>
                    <div class="share-wrap">
                        <button id="btn-share" type="button" aria-haspopup="true" aria-expanded="false" title="Copy a link to this model or download it as an image">
                            Share ▾
                        </button>
                        <div id="share-menu" class="share-menu" hidden>
                            <button id="btn-copy-link" type="button">Copy link</button>
                            <button id="btn-export-svg" type="button">Download .svg…</button>
                            <button id="btn-export-png" type="button">Download .png…</button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div id="warning" class="warning" hidden></div>

        <main class="layout">
            <div class="canvas-column">
                <div id="editor-toolbar" class="toolbar" role="toolbar" aria-label="Graph editing tools"></div>
                <section id="graph-container" aria-label="Graph canvas"></section>
            </div>
        </main>

        <footer>
            This work is licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a><img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;">
        </footer>

        <dialog id="png-dialog" class="modal" aria-labelledby="png-dialog-title">
            <h2 id="png-dialog-title" class="modal-title">Export as PNG</h2>
            <div class="modal-preview">
                <img id="png-preview-img" alt="Preview of the exported PNG" hidden />
            </div>
            <div class="modal-body">
                <fieldset class="field">
                    <legend class="field-label">Color mode</legend>
                    <div class="segmented">
                        <label class="segment">
                            <input id="png-theme-light" type="radio" name="png-theme" value="light" />
                            <span>Light</span>
                        </label>
                        <label class="segment">
                            <input id="png-theme-dark" type="radio" name="png-theme" value="dark" />
                            <span>Dark</span>
                        </label>
                    </div>
                </fieldset>
                <label class="field field-inline">
                    <input id="png-transparent" type="checkbox" />
                    <span>Transparent background</span>
                </label>
                <label class="field field-inline">
                    <input id="png-legend" type="checkbox" checked />
                    <span>Include legend</span>
                </label>
                <label class="field">
                    <span class="field-label">Width in pixels</span>
                    <input id="png-width" type="number" min="120" max="8000" step="10" value="1500" />
                </label>
                <p id="png-size-hint" class="field-hint"></p>
                <label class="field">
                    <span class="field-label">File name</span>
                    <input id="png-filename" type="text" value="shift-left-right.png" spellcheck="false" autocomplete="off" />
                </label>
            </div>
            <div class="modal-actions">
                <button id="png-cancel" type="button">Cancel</button>
                <button id="png-download" type="button" class="primary">Download .png</button>
            </div>
        </dialog>

        <dialog id="svg-dialog" class="modal" aria-labelledby="svg-dialog-title">
            <h2 id="svg-dialog-title" class="modal-title">Export as SVG</h2>
            <div class="modal-preview">
                <img id="svg-preview-img" alt="Preview of the exported SVG" hidden />
            </div>
            <div class="modal-body">
                <fieldset class="field">
                    <legend class="field-label">Color mode</legend>
                    <div class="segmented">
                        <label class="segment">
                            <input id="svg-theme-light" type="radio" name="svg-theme" value="light" />
                            <span>Light</span>
                        </label>
                        <label class="segment">
                            <input id="svg-theme-dark" type="radio" name="svg-theme" value="dark" />
                            <span>Dark</span>
                        </label>
                    </div>
                </fieldset>
                <label class="field field-inline">
                    <input id="svg-transparent" type="checkbox" />
                    <span>Transparent background</span>
                </label>
                <label class="field field-inline">
                    <input id="svg-legend" type="checkbox" checked />
                    <span>Include legend</span>
                </label>
                <label class="field">
                    <span class="field-label">File name</span>
                    <input id="svg-filename" type="text" value="shift-left-right.svg" spellcheck="false" autocomplete="off" />
                </label>
            </div>
            <div class="modal-actions">
                <button id="svg-cancel" type="button">Cancel</button>
                <button id="svg-download" type="button" class="primary">Download .svg</button>
            </div>
        </dialog>

        <script type="module" src="app.js"></script>
    </body>
</html>
